<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💖</title>

<style>
body{
    margin:0;
    height:100vh;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    overflow:hidden;
    text-align:center;
}

h1{
    color:#ff4d6d;
    margin-bottom:40px;
    font-size:32px;
}

.buttons{
    position:relative;
    width:320px;
    height:140px;
}

button{
    position:absolute;
    padding:15px 30px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    z-index:2;
}

#yesBtn{
    left:30px;
    top:50px;
    background:#ff4d6d;
    color:white;
}

#noBtn{
    left:160px;
    top:50px;
    background:#888;
    color:white;
    transition:0.2s;
}

#message{
    display:none;
    margin-top:30px;
    font-size:26px;
    color:#ff4d6d;
    font-weight:bold;
}

.heart{
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    transform: rotate(45deg);
    animation: floatUp linear infinite;
    z-index:1;
}

.heart:before,
.heart:after{
    content:'';
    position:absolute;
    width:20px;
    height:20px;
    background:red;
    border-radius:50%;
}

.heart:before{
    top:-10px;
    left:0;
}

.heart:after{
    left:10px;
    top:0;
}

@keyframes floatUp{
    0% { transform: translateY(0) rotate(45deg); opacity:1; }
    100% { transform: translateY(-600px) rotate(45deg); opacity:0; }
}

canvas{
    position:fixed;
    top:0;
    left:0;
    pointer-events:none;
    z-index:3;
}
</style>
</head>

<body>

<h1>Will you be my Valentine, <span id="herName">Mary Rose Sio</span>? 💘</h1>

<div class="buttons">
    <button id="yesBtn">Yes 💖</button>
    <button id="noBtn">No 🙈</button>
</div>

<div id="message">Yaaay!! I knew it! 💕 See you on our date! 😘</div>

<!-- Background music -->
<audio id="music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mpeg">
</audio>

<canvas id="confetti"></canvas>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const message = document.getElementById("message");
const container = document.querySelector(".buttons");
const music = document.getElementById("music");

// Auto play music (may require user interaction first on mobile)
music.play().catch(()=>{});

// Move NO button
function moveNoButton() {
    const maxX = container.clientWidth - noBtn.offsetWidth;
    const maxY = container.clientHeight - noBtn.offsetHeight;
    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;
    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
}

noBtn.addEventListener("mouseenter", moveNoButton);
noBtn.addEventListener("touchstart", function(e){
    e.preventDefault();
    moveNoButton();
});

// YES button click
yesBtn.addEventListener("click", function(){
    message.style.display = "block";
    yesBtn.style.display = "none";
    noBtn.style.display = "none";
    startConfetti();
});

// CONFETTI effect
const canvas = document.getElementById("confetti");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let confettiParticles = [];

function startConfetti(){
    for(let i=0;i<200;i++){
        confettiParticles.push({
            x: Math.random()*canvas.width,
            y: Math.random()*canvas.height,
            r: Math.random()*6+4,
            d: Math.random()*20+10,
            color:`hsl(${Math.random()*360}, 100%, 50%)`,
            tilt:Math.random()*10-10,
            tiltAngleIncrement: Math.random()*0.07+0.05
        });
    }
    requestAnimationFrame(drawConfetti);
}

function drawConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiParticles.forEach((p)=>{
        ctx.beginPath();
        ctx.lineWidth = p.r/2;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x+p.tilt+p.r/2, p.y);
        ctx.lineTo(p.x+p.tilt, p.y+p.tilt+p.r/2);
        ctx.stroke();
        p.tilt += p.tiltAngleIncrement;
        p.y += (Math.cos(p.d)+3+p.r/2)/2;
        if(p.y>canvas.height) p.y=-10;
    });
    requestAnimationFrame(drawConfetti);
}

// Floating hearts
function createHeart(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.style.left = Math.random()*window.innerWidth + "px";
    heart.style.animationDuration = (Math.random()*3+2)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),5000);
}
setInterval(createHeart, 400);

</script>

</body>
</html>
